<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dice API Tester</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    button { margin: 0.3rem; padding: 0.5rem 1rem; cursor: pointer; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>Dice Roller REST API – Test Page</h1>
  <p>This page only tests the remote APIs. It does <strong>not</strong> implement the Dice Roller application.</p>

  <h2>Endpoints</h2>
  <button onclick="test('/api/wakeup')">GET /api/wakeup</button>
  <button onclick="test('/api/random?min=1&max=6')">GET /api/random (1-6)</button>
  <button onclick="test('/api/roll/20')">GET /api/roll/20</button>
  <button onclick="test('/api/roll-many?sides=6&count=3')">GET /api/roll-many</button>
  <button onclick="test('/api/no-cors-random?min=1&max=6')">GET /api/no-cors-random (CORS fail)</button>

  <h2>Result</h2>
  <pre id="out">Click a button…</pre>

  <script>
    async function test(path) {
      const out = document.getElementById('out');
      out.textContent = 'Loading…';
      try {
        const res = await fetch(path);
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        out.innerHTML = `<span class="error">Error: ${err.message}</span>\n\n(Expected for /api/no-cors-random when called from a different origin.)`;
      }
    }
  </script>
</body>
</html>
